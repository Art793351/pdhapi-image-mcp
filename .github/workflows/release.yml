name: Release package
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install Secret Service (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-tools gnome-keyring dbus-x11
      - name: Start DBus and unlock keyring (Linux)
        if: runner.os == 'Linux'
        run: |
          eval $(dbus-launch --sh-syntax)
          echo "DBUS_SESSION_BUS_ADDRESS=$DBUS_SESSION_BUS_ADDRESS" >> $GITHUB_ENV
          echo "DBUS_SESSION_BUS_PID=$DBUS_SESSION_BUS_PID" >> $GITHUB_ENV
          echo '' | gnome-keyring-daemon --unlock
      - run: npm ci
      - run: npm run check
      - run: npm test

  package:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify tag
        run: node --input-type=module -e 'import fs from "node:fs"; if(process.env.GITHUB_REF_NAME !== "v"+JSON.parse(fs.readFileSync("package.json")).version) process.exit(1)'
      - run: npm pack
      - run: sha256sum *.tgz > SHA256SUMS
      - run: gh release create "$GITHUB_REF_NAME" *.tgz SHA256SUMS --generate-notes --prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
